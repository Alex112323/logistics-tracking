global
    maxconn 100

defaults
    mode tcp
    timeout connect 5s
    timeout client 30m
    timeout server 30m

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5432
    option httpchk OPTIONS /primary
    http-check expect status 200
    server patroni1 patroni1:5432 maxconn 100 check port 8008
    server patroni2 patroni2:5432 maxconn 100 check port 8008
    server patroni3 patroni3:5432 maxconn 100 check port 8008

frontend rabbitmq_amqp
    bind *:5672
    mode tcp
    default_backend rabbitmq_cluster

backend rabbitmq_cluster
    mode tcp
    balance roundrobin
    option tcp-check
    tcp-check connect
    tcp-check send AMQP\0\0\x09\x01
    tcp-check expect string AMQP
    server rabbitmq1 rabbitmq1:5672 check inter 5s rise 2 fall 3
    server rabbitmq2 rabbitmq2:5672 check inter 5s rise 2 fall 3
    server rabbitmq3 rabbitmq3:5672 check inter 5s rise 2 fall 3
