services:
  tracking-service:
    build: ./tracking-service
    container_name: tracking-service
    environment:
      DATABASE_URL: postgresql://tracking:tracking_pass@tracking-db:5432/logistics
      REDIS_URL: redis://tracking-cache:6379/0
      RABBITMQ_URL: amqp://guest:guest@tracking-broker:5672/
    ports:
      - "8000:8000"
    depends_on:
      tracking-db:
        condition: service_healthy
      tracking-cache:
        condition: service_healthy
      tracking-broker:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
      - db-net

  event-worker:
    build: ./event-worker
    container_name: event-worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@tracking-broker:5672/
    depends_on:
      tracking-broker:
        condition: service_healthy
    networks:
      - backend-net

  tracking-db:
    image: postgres:16-alpine
    container_name: tracking-db
    environment:
      POSTGRES_USER: tracking
      POSTGRES_PASSWORD: tracking_pass
      POSTGRES_DB: logistics
    volumes:
      - tracking_pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracking -d logistics"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - db-net

  tracking-cache:
    image: redis:7-alpine
    container_name: tracking-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  tracking-broker:
    image: rabbitmq:3.13-management-alpine
    container_name: tracking-broker
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "15672:15672"  
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend-net

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true

  db-net:
    driver: bridge
    internal: true

volumes:
  tracking_pg_data: