services:
  tracking-service:
    build: ./tracking-service
    container_name: tracking-service
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8000:8000"
    depends_on:
      haproxy:
        condition: service_healthy
      tracking-cache:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-net
      - db-net

  event-worker:
    build: ./event-worker
    container_name: event-worker
    environment:
      RABBITMQ_URL: ${RABBITMQ_URL}
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - backend-net

  etcd1:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd1
    command: >
      etcd --name etcd1
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd1:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd1:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token tracking-etcd
      --initial-cluster-state new
    volumes:
      - etcd1_data:/etcd-data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  etcd2:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd2
    command: >
      etcd --name etcd2
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd2:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd2:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token tracking-etcd
      --initial-cluster-state new
    volumes:
      - etcd2_data:/etcd-data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  etcd3:
    image: quay.io/coreos/etcd:v3.5.0
    container_name: etcd3
    command: >
      etcd --name etcd3
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://etcd3:2379
      --listen-peer-urls http://0.0.0.0:2380
      --initial-advertise-peer-urls http://etcd3:2380
      --initial-cluster etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      --initial-cluster-token tracking-etcd
      --initial-cluster-state new
    volumes:
      - etcd3_data:/etcd-data
    networks:
      - db-net
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  patroni1:
    build: ./patroni
    container_name: patroni1
    environment:
      PATRONI_NAME: patroni1
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PATRONI_REWIND_PASSWORD: ${POSTGRES_REWIND_PASSWORD}
    volumes:
      - patroni1_data:/var/lib/postgresql/data-parent
      - ./db/init.sql:/init.sql:ro                
      - ./patroni/init-schema.sh:/init-schema.sh:ro
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro
    depends_on:
      etcd1:
        condition: service_healthy
      etcd2:
        condition: service_healthy
      etcd3:
        condition: service_healthy
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/primary || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  patroni2:
    build: ./patroni
    container_name: patroni2
    environment:
      PATRONI_NAME: patroni2
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PATRONI_REWIND_PASSWORD: ${POSTGRES_REWIND_PASSWORD}
    volumes:
      - patroni2_data:/var/lib/postgresql/data-parent
      - ./db/init.sql:/init.sql:ro                 
      - ./patroni/init-schema.sh:/init-schema.sh:ro
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro  
    depends_on:
      patroni1:
        condition: service_healthy
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/replica || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  patroni3:
    build: ./patroni
    container_name: patroni3
    environment:
      PATRONI_NAME: patroni3
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      PATRONI_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PATRONI_REWIND_PASSWORD: ${POSTGRES_REWIND_PASSWORD}
    volumes:
      - patroni3_data:/var/lib/postgresql/data-parent
      - ./db/init.sql:/init.sql:ro                   
      - ./patroni/init-schema.sh:/init-schema.sh:ro
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro
    depends_on:
      patroni2:
        condition: service_healthy
    networks:
      - db-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/replica || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  haproxy:
    image: haproxy:2.9-alpine
    container_name: haproxy
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5432:5432"
      - "7001:7000"
    networks:
      - db-net
      - backend-net
    depends_on:
      patroni1:
        condition: service_healthy
      patroni2:
        condition: service_healthy
      patroni3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5432 && nc -z 127.0.0.1 5672 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  tracking-cache:
    image: redis:7-alpine
    container_name: tracking-cache
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend-net

  rabbitmq1:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro 
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq2:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro 
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq3:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq3
    hostname: rabbitmq3
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    volumes:
      - rabbitmq3_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro 
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup-scheduler:
    image: prodrigestivill/postgres-backup-local:latest
    container_name: backup-scheduler
    restart: always
    user: postgres:postgres
    environment:
      POSTGRES_HOST: haproxy
      POSTGRES_PORT: 5432
      POSTGRES_DB: logistics
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"          
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      BACKUP_ON_START: "TRUE"     
    volumes:
      - ./backups:/backups
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - db-net

  outbox-dispatcher:
    build: ./outbox-dispatcher
    container_name: outbox-dispatcher
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      EXCHANGE_NAME: tracking
      POLL_INTERVAL_MS: "100"
      BATCH_SIZE: "100"
    depends_on:
      haproxy:
        condition: service_healthy
    networks:
      - backend-net
      - db-net

networks:
  frontend-net:
    driver: bridge

  backend-net:
    driver: bridge
    internal: true

  db-net:
    driver: bridge
    internal: true

volumes:
  etcd1_data:
  etcd2_data:
  etcd3_data:
  patroni1_data:
  patroni2_data:
  patroni3_data:
  rabbitmq1_data:
  rabbitmq2_data:
  rabbitmq3_data: